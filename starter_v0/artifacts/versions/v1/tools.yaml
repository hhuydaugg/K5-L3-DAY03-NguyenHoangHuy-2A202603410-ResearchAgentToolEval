tools:
- name: clarify
  description: Ask one focused question and wait for the next user turn. Use when required information is missing,
    or before a write action. Do not guess an account, URL, or confirmation.
  parameters:
    type: object
    properties:
      question:
        type: string
        default: ''
        description: Câu hỏi
      response_type:
        type: string
        enum:
        - text
        - yes_no
        - choice
        default: text
        description: Kiểu trả lời
      options:
        type: array
        default: []
        items:
          type: string
        description: Các lựa chọn
    required:
    - question
- name: timeline
  description: Fetch recent posts from one specified X/Twitter account. Use for posts BY a person/account; do not
    use for a topic search or general web news.
  parameters:
    type: object
    properties:
      screenname:
        type: string
        default: ''
        description: Tên tài khoản
      limit:
        type: integer
        default: 5
        description: Số lượng
    required:
    - screenname
- name: social_search
  description: Search X/Twitter posts ABOUT a topic. Use for public discussion, top posts, or latest posts about
    keywords; do not use for posts by one specific account or web articles.
  parameters:
    type: object
    properties:
      query:
        type: string
        default: ''
        description: Từ khóa
      search_type:
        type: string
        enum:
        - Latest
        - Top
        default: Latest
        description: Cách sắp xếp
      limit:
        type: integer
        default: 5
        description: Số lượng
    required:
    - query
- name: lookup
  description: Search the web for a topic or news. Use for general research or news discovery; do not use for reading
    an already supplied URL or Twitter-only requests.
  parameters:
    type: object
    properties:
      query:
        type: string
        default: ''
        description: Truy vấn
      topic:
        type: string
        enum:
        - general
        - news
        default: general
        description: Phân loại
      timeframe:
        type: string
        enum:
        - day
        - week
        - month
        - year
        default: week
        description: Khoảng thời gian
      max_results:
        type: integer
        default: 5
        description: Số kết quả
    required:
    - query
- name: fetch
  description: Read one user-supplied or previously retrieved HTTP(S) URL. Use when the user asks about that particular
    article; do not invent a URL or replace it with a web search.
  parameters:
    type: object
    properties:
      url:
        type: string
        default: ''
        description: Địa chỉ
    required:
    - url
- name: format
  description: Format items already supplied by the user or returned by tools into a cited digest. Do not search
    or fabricate items. Use only after the required items are available.
  parameters:
    type: object
    properties:
      items:
        type: array
        default: []
        description: Danh sách item
        items:
          type: object
          properties:
            title:
              type: string
            url:
              type: string
            source:
              type: string
            summary:
              type: string
            section:
              type: string
      template:
        type: string
        enum:
        - brief
        - sections
        - bullets
        - thread
        - daily_ai_vn
        default: sections
        description: Khuôn
      headline:
        type: string
        default: ''
        description: Tiêu đề
    required:
    - items
    - template
- name: send
  description: Post the exact text to the configured Telegram channel. This is a write action, not a way to answer
    the user. Never use it for unrelated tasks.
  parameters:
    type: object
    properties:
      text:
        type: string
        default: ''
        description: Nội dung
      confirmed:
        type: boolean
        default: false
        description: Cờ xác nhận
    required:
    - text
- name: policy
  description: Search local company policy documents. Use for internal rules about research, citations, privacy,
    publishing, or tool usage; do not use as evidence of current public news.
  parameters:
    type: object
    properties:
      query:
        type: string
        default: ''
        description: Truy vấn
      policy_area:
        type: string
        enum:
        - all
        - ai_research
        - source_citation
        - data_privacy
        - external_publishing
        - tool_usage
        default: all
        description: Nhóm
      top_k:
        type: integer
        default: 3
        description: Số mục
    required:
    - query
- name: papers
  description: Find academic papers on arXiv by topic. Use for paper discovery; do not use for reading the full
    text of a known paper or for ordinary news.
  parameters:
    type: object
    properties:
      query:
        type: string
        default: ''
        description: Từ khóa
      max_results:
        type: integer
        default: 5
        description: Số lượng
      sort_by:
        type: string
        enum:
        - relevance
        - lastUpdatedDate
        - submittedDate
        default: relevance
        description: Sắp xếp
    required:
    - query
- name: paper_text
  description: Download and extract text from one known arXiv ID or URL. Use after a paper has been identified;
    do not use to discover papers by topic.
  parameters:
    type: object
    properties:
      arxiv_url:
        type: string
        default: ''
        description: ID hoặc địa chỉ
      max_pages:
        type: integer
        default: 5
        description: Số trang
      max_chars:
        type: integer
        default: 8000
        description: Số ký tự
    required:
    - arxiv_url
- name: deduplicate
  description: Remove duplicate source URLs from existing research items, ignoring tracking parameters and fragments.
    Use when asked to remove duplicate links or before a digest has duplicate sources. Does not search, summarize,
    verify claims, or merge different articles.
  parameters:
    type: object
    properties:
      items:
        type: array
        default: []
        description: Existing research items to deduplicate; preserve their titles, text and source URLs.
        items:
          type: object
          properties:
            title:
              type: string
            url:
              type: string
            source:
              type: string
            summary:
              type: string
            section:
              type: string
    required:
    - items
